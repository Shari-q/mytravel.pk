<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Gold/Green Double Border -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#0B6623" stroke-width="4"/>
  <circle cx="50" cy="50" r="44" fill="#0B6623"/>
  <circle cx="50" cy="50" r="42" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="39" fill="#0B6623"/>
  
  <!-- Text Ring -->
  <text x="50" y="24" font-family="'DM Sans', Arial, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.3">GOVERNMENT OF PAKISTAN</text>
  <text x="50" y="32" font-family="'DM Sans', Arial, sans-serif" font-size="6.2" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TOURISM SERVICES</text>
  
  <!-- Inner Center White Shield -->
  <circle cx="50" cy="55" r="22" fill="#FFFFFF"/>
  
  <!-- Crescent & Star -->
  <circle cx="50" cy="52" r="10" fill="#0B6623"/>
  <circle cx="53" cy="50" r="8" fill="#FFFFFF"/>
  <polygon points="50,44 51.5,47.5 55,47.5 52,49.5 53.5,53 50,51 46.5,53 48,49.5 45,47.5 48.5,47.5" fill="#0B6623"/>
  
  <!-- Bold DTS Banner -->
  <rect x="26" y="65" width="48" height="13" rx="4" fill="#0B6623"/>
  <text x="50" y="75" font-family="'DM Sans', Arial, sans-serif" font-size="10" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">DTS</text>
  
  <!-- License Status -->
  <text x="50" y="91" font-family="'DM Sans', Arial, sans-serif" font-size="6" font-weight="800" fill="#FFFFFF" text-anchor="middle">LICENSED AGENCY</text>
</svg>