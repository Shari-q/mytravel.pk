<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="#003882" stroke-width="4"/>
  <circle cx="50" cy="50" r="43" fill="#003882"/>
  <circle cx="50" cy="50" r="41" fill="#FFFFFF"/>
  <circle cx="50" cy="50" r="38" fill="#003882"/>
  
  <!-- Outer Curved Text Effect -->
  <text x="50" y="24" font-family="'DM Sans', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">TRAVEL INDUSTRY</text>
  <text x="50" y="32" font-family="'DM Sans', Arial, sans-serif" font-size="6.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">DESIGNATOR SERVICE</text>
  
  <!-- Center IATA Monogram Box -->
  <rect x="22" y="38" width="56" height="26" rx="4" fill="#FFFFFF"/>
  <text x="50" y="56" font-family="'DM Sans', Arial, sans-serif" font-size="18" font-weight="900" fill="#003882" text-anchor="middle" letter-spacing="1">IATA</text>
  
  <!-- Lower Pill TIDS -->
  <rect x="30" y="68" width="40" height="13" rx="6.5" fill="#38BDF8"/>
  <text x="50" y="78" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="900" fill="#003882" text-anchor="middle" letter-spacing="1.5">TIDS</text>
  <text x="50" y="92" font-family="'DM Sans', Arial, sans-serif" font-size="5.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">ACCREDITED</text>
</svg>